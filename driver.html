<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبيستا - السائق</title>
<style>
:root{--ink:#14201c;--paper:#f3f6f4;--card:#fff;--mut:#62736c;--g:#0b7a55;--amb:#f2a900;--red:#c0392b;--ln:#d9e2de}
@media(prefers-color-scheme:dark){:root{--ink:#e9f0ed;--paper:#0f1613;--card:#18221e;--mut:#93a49d;--ln:#2a3833}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:center}header b{font-size:21px;color:var(--g)}
main{padding:0 16px;max-width:520px;margin:auto}.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
button,input{font:inherit;color:inherit}input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin:4px 0 10px}
button{padding:12px 14px;border-radius:10px;border:1px solid var(--g);background:none;color:var(--g);font-weight:600}
button.p{background:var(--g);color:#fff}button.d{border-color:var(--red);color:var(--red)}button.w{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}
.tog{width:100%;padding:18px;font-size:22px;border-radius:16px}.tog.on{background:var(--g);color:#fff}.tog.off{border-color:var(--red);color:var(--red)}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--ln);font-size:14px}.u{background:var(--amb);color:#000}
.warn{background:#c0392b22;border:1px solid var(--red);border-radius:12px;padding:12px;margin:12px 0}.big{font-size:30px;font-weight:700}
.err{color:var(--red);min-height:22px}.note{color:var(--mut);font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid var(--ln);text-align:right}
footer{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
footer button{flex:1;border:0;border-radius:0;color:var(--mut);padding:14px 2px;font-size:14px;white-space:nowrap}footer button.on{color:var(--g)}#off{background:var(--red);color:#fff;text-align:center;padding:6px}:focus-visible{outline:3px solid var(--amb)}
</style><script src="map.js"></script></head><body>
<div id="off" hidden>لا يوجد اتصال بالإنترنت. ستُحدَّث البيانات عند عودته.</div>
<header><b>طلبيستا - السائق</b><button id="out" hidden>خروج</button></header>
<main id="app"></main><footer id="ft" hidden></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={NEW:'جديد',SEARCHING_DRIVER:'بحث عن سائق',DRIVER_ASSIGNED:'تم تعيينك',DRIVER_ON_THE_WAY:'في الطريق للاستلام',DRIVER_ARRIVED:'وصلت',ORDER_PICKED_UP:'تم الاستلام',ON_THE_WAY_TO_CUSTOMER:'في الطريق للعميل',DELIVERED:'مكتمل',CANCELLED:'ملغى'};
const NEXT={DRIVER_ASSIGNED:['DRIVER_ON_THE_WAY','أنا في الطريق'],DRIVER_ON_THE_WAY:['DRIVER_ARRIVED','وصلت لمكان الاستلام'],DRIVER_ARRIVED:['ORDER_PICKED_UP','استلمت الطلب'],ORDER_PICKED_UP:['ON_THE_WAY_TO_CUSTOMER','في الطريق إلى العميل'],ON_THE_WAY_TO_CUSTOMER:['DELIVERED','تم التسليم']};
const ERR={'bad credentials':'رقم الهاتف أو كلمة المرور غير صحيحة','offer not available':'انتهت مهلة العرض أو لم يعد متاحًا','cannot cancel now':'لا يمكن إلغاء الطلب بعد الاستلام','invalid transition':'لا يمكن تنفيذ هذه الخطوة الآن','bad coordinates':'إحداثيات الموقع غير صحيحة','not eligible':'لا يمكنك قبول الطلب حاليًا (حجب أو حد العهدة أو غير متاح أو لديك طلب نشط)','already requested':'طلب التسوية مرسل مسبقًا وبانتظار الإدارة','too many attempts':'محاولات كثيرة، حاول بعد 15 دقيقة','invalid password':'كلمة المرور الحالية غير صحيحة أو الجديدة أقل من 8 أحرف'};
const TABS={home:'الرئيسية',orders:'الطلبات',fin:'المالية',notes:'الإشعارات',me:'حسابي'};
let tok=localStorage.getItem('dr'),tab='home',S=null,timer;
async function api(m,p,b){try{const r=await fetch((window.TB_API||'')+'/api'+p,{method:m,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:m==='GET'?undefined:JSON.stringify(b||{})});const j=await r.json();$('#off').hidden=true;
 if(r.status===401&&p!=='/login'){logout(true);throw new Error('انتهت الجلسة')}if(!r.ok)throw new Error(ERR[j.error]||j.error);return j}
 catch(e){if(e instanceof TypeError){$('#off').hidden=false;throw new Error('تعذر الاتصال بالخادم')}throw e}}
const msg=t=>{const e=$('.err');if(e)e.textContent=t||''};const go=async f=>{try{await f()}catch(e){msg(e.message)}};
async function logout(skip){try{if(!skip&&'serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistration(),s=r&&await r.pushManager.getSubscription();if(s)await api('POST','/push/unsubscribe',{endpoint:s.endpoint}).catch(()=>{})}}catch(_){}window.tbNative&&tbNative.unregister(tok);tok=null;S=null;localStorage.removeItem('dr_S');localStorage.removeItem('dr');localStorage.removeItem('push');saveTok(null);clearInterval(timer);login()}$('#out').onclick=()=>logout();
function saveTok(t){try{const r=indexedDB.open('tb',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>{const s=r.result.transaction('k','readwrite').objectStore('k');t?s.put(t,'tok'):s.delete('tok')}}catch(_){}}
async function enablePush(){if(!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('هذا المتصفح لا يدعم الإشعارات الفورية');
 if(await Notification.requestPermission()!=='granted')throw new Error('لم يتم السماح بالإشعارات');
 const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;const{key}=await api('GET','/push/key');
 const k=Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:k});
 await api('POST','/push/subscribe',{endpoint:sub.endpoint});saveTok(tok);localStorage.setItem('push','1')}
let AC;const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(_){}};document.addEventListener('click',unlock);document.addEventListener('touchstart',unlock);
function beep(seq){if(!AC)return;let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,t);g.gain.setValueAtTime(0,t+d);o.start(t);o.stop(t+d);t+=d+.05})}
const SEEN=new Set();
function alertNew(of){for(const o of of){if(SEEN.has(o.order_id))continue;SEEN.add(o.order_id);
 if(o.urgent){beep([[1200,.2],[800,.2],[1200,.2],[800,.2],[1200,.4]]);navigator.vibrate&&navigator.vibrate([400,100,400,100,400,100,800])}else{beep([[880,.25],[660,.35]]);navigator.vibrate&&navigator.vibrate([200,100,200])}}}
addEventListener('online',()=>{if(tok)load()});
function login(){$('#ft').hidden=$('#out').hidden=true;$('#app').innerHTML=`<div class="card"><h2>دخول السائق</h2><input id="ph" type="tel" inputmode="numeric" placeholder="رقم الهاتف"><input id="pw" type="password" placeholder="كلمة المرور"><div class="err"></div><button class="p w" id="go">دخول</button><p class="note">حسابات السائقين تُنشأ من الإدارة فقط.</p></div>`;
 $('#go').onclick=()=>go(async()=>{const r=await api('POST','/login',{phone:$('#ph').value.trim(),password:$('#pw').value});if(r.role!=='DRIVER')throw new Error('هذا التطبيق للسائقين فقط');tok=r.token;localStorage.setItem('dr',tok);start()})}
function start(){$('#out').hidden=$('#ft').hidden=false;if(localStorage.getItem('push'))saveTok(tok);if(!S){try{S=JSON.parse(localStorage.getItem('dr_S'));S&&draw()}catch(_){S=null}}load();sendLoc();clearInterval(LT);LT=setInterval(sendLoc,60000);clearInterval(timer);timer=setInterval(()=>{if(document.activeElement.tagName!=='INPUT')load()},4000)}
async function load(){try{const[me,offers,orders,notes,viol]=await Promise.all([api('GET','/me'),api('GET','/driver/offers'),api('GET','/driver/orders'),api('GET','/notifications'),api('GET','/driver/violations')]);S={me,offers,orders,notes,viol};
 if(tab==='fin')S.ledger=await api('GET','/driver/ledger');localStorage.setItem('dr_S',JSON.stringify(S));draw();alertNew(S.offers);if(!LOC.at&&!LOC.err)sendLoc()}catch(e){if(!S)msg(e.message)}}
const act=()=>S.orders.find(o=>!['DELIVERED','CANCELLED'].includes(o.status));
function blocked(){const f=S.notes.find(n=>n.text.startsWith('وصلت عهدتك')||n.text==='تم تأكيد استلام العهدة');return S.me.driver.outstanding>0&&!!f&&f.text.startsWith('وصلت عهدتك')}
const unread=()=>S.notes.filter(n=>!n.read).length;
function draw(){if(!S)return;if(tab==='notes'&&unread())api('POST','/notifications/read').catch(()=>{});$('#ft').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v}${k==='notes'&&unread()?' ('+unread()+')':''}</button>`).join('');
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;load()});$('#app').innerHTML=V[tab]()+'<div class="err"></div>'}
const V={home(){const d=S.me.driver,a=act(),bl=blocked(),ts=Date.now()/1000,bk=d.blocked_until>ts,vv=(S.viol||[]).find(v=>v.status==='ACTIVE'&&v.blocked_until>ts);
 return `<button class="tog ${d.available?'on':'off'}" data-a="av">${d.available?'🟢 متاح':'🔴 غير متاح'}</button><p class="note">${d.available?'ستصلك الطلبات الجديدة تلقائيًا.':'لن تصلك طلبات جديدة.'}</p>${d.available?`<p class="note"><span class="chip">${{AVAILABLE:'متاح',BUSY:'مشغول (طلبان نشطان)',UNAVAILABLE:'غير متاح'}[d.status]||''}</span> ${LOC.err?`<span style="color:var(--red)">${esc(LOC.err)}</span>`:LOC.at?'📍 تم تحديث موقعك قبل '+Math.max(1,Math.round((Date.now()-LOC.at)/60000))+' دقيقة':'📍 جارٍ تحديد موقعك...'}</p>`:''}
 <div class="card">عهدتك تجاه الشركة<div class="big">${d.outstanding} د.ل</div>${d.outstanding>0?'<button class="w" data-a="ho">طلب تسوية العهدة</button>':''}</div>
 ${bl?'<div class="warn">وصلت عهدتك إلى الحد المسموح. يرجى تسوية العهدة لدى الشركة قبل استقبال طلبات جديدة.</div>':''}
 ${bk?`<div class="warn"><b>تم إيقاف استقبال الطلبات لمدة 24 ساعة بسبب مخالفة</b>${vv?`<br>السبب: ${esc(vv.reason)}<br>الغرامة: ${vv.fine} د.ل`:''}<br>المتبقي: نحو ${Math.ceil((d.blocked_until-ts)/3600)} ساعة</div>`:''}
 ${(!window.__tbDemo&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())&&(!('Notification'in window)||Notification.permission!=='granted'||!localStorage.getItem('push')))?'<button class="w" data-a="pu">🔔 تفعيل الإشعارات الفورية</button>':''}
 ${S.offers.map(o=>`<div class="card" style="border-color:var(--amb);border-width:2px"><b>${o.urgent?'⚡ طلب مستعجل قريب منك':'🚚 طلب جديد قريب منك'}</b> <span class="chip">${Math.max(0,o.expires-Math.floor(Date.now()/1000))} ثانية</span><p>#${o.order_id}${o.distance_m!=null?' • يبعد '+(o.distance_m>=1000?(o.distance_m/1000).toFixed(1)+' كم':Math.round(o.distance_m/10)*10+' متر'):''}<br>${o.store_name?`<b>${esc(o.store_name)}</b><br>`:''}الاستلام: ${esc(o.store_address||o.pickup)}<br>التسليم: ${esc(o.dropoff)}<br><span class="note">${esc(o.details)}${o.notes?' • '+esc(o.notes):''}</span></p>
 ${o.kind==='STORE'?`<p>أجرة التوصيل: <b>${o.delivery_fee} د.ل</b><br>${o.is_paid?'الطلبية خالصة':'غير خالصة - قيمة الطلبية: <b>'+o.order_value+' د.ل</b>'}</p>`:`<input id="pr" type="number" min="0" inputmode="decimal" placeholder="السعر المتفق عليه مع العميل (اختياري)"><p class="note">السعر يُتفق عليه بينك وبين العميل ولا يدخل في عمولة الشركة.</p>`}<div class="row"><button class="d" data-a="rj" data-id="${o.order_id}">رفض</button><button class="p" data-a="ac" data-id="${o.order_id}">قبول</button></div></div>`).join('')}
 ${a?`<div class="card"><b>طلبك الحالي #${a.id}</b> ${a.urgent?'<span class="chip u">مستعجل ⚡</span>':''} <span class="chip">${ST[a.status]}</span><p>${a.kind==='STORE'?`<b>${esc(a.customer_name)}</b> (المتجر)<br>عنوان المتجر: ${esc(a.store_address)}<br>`:''}من: ${esc(a.pickup)}<br>إلى: ${esc(a.dropoff)}<br><span class="note">${esc(a.details)}${a.notes?' • '+esc(a.notes):''}</span>${a.kind!=='STORE'&&a.customer_name?`<br>العميل: ${esc(a.customer_name)}`:''}${a.contact?`<br>الزبون: ${esc(a.contact)}`:''}${a.kind==='STORE'?`<br>أجرة التوصيل: ${a.delivery_fee} د.ل<br>${a.is_paid?'الطلبية خالصة':'غير خالصة - قيمة الطلبية: '+a.order_value+' د.ل'}`:''}${a.agreed_price!=null?`<br>السعر المتفق: ${a.agreed_price} د.ل`:''}</p>
 ${a.customer_phone?`<a href="tel:${esc(a.customer_phone)}" style="display:block;text-align:center;padding:12px;border:1px solid var(--g);border-radius:10px;color:var(--g);text-decoration:none;font-weight:600;margin-bottom:8px">${a.kind==='STORE'?'اتصال بالمتجر':'اتصال بالعميل'} ${esc(a.customer_phone)}</a>`:''}
 ${(a.pickup_lat!=null||a.dropoff_lat!=null)?`<button class="w" data-a="mp" data-id="${a.id}" style="margin-bottom:8px">🗺️ الخريطة والاتجاهات</button>`:''}
 ${NEXT[a.status]?`<button class="p w" data-a="nx" data-id="${a.id}" data-s="${NEXT[a.status][0]}">${NEXT[a.status][1]}</button>`:''}
 ${['DRIVER_ASSIGNED','DRIVER_ON_THE_WAY','DRIVER_ARRIVED'].includes(a.status)?`<p><button class="d w" data-a="cn" data-id="${a.id}">إلغاء الطلب من جهتي</button></p>`:''}</div>`:(!S.offers.length&&!bl?'<p class="note">لا توجد طلبات حاليًا.</p>':'')}`},
orders(){return S.orders.map(o=>`<div class="card"><b>#${o.id}</b> ${o.urgent?'<span class="chip u">مستعجل ⚡</span>':''} <span class="chip">${ST[o.status]}</span><br>${esc(o.pickup)} ← ${esc(o.dropoff)}<br>${new Date(o.created*1000).toLocaleString('ar-LY')}</div>`).join('')||'<p class="note">لا توجد طلبات بعد.</p>'},
notes(){return S.notes.map(n=>`<div class="card">${esc(n.text)}<br><span class="note">${new Date(n.at*1000).toLocaleString('ar-LY')}</span></div>`).join('')||'<p class="note">لا توجد إشعارات.</p>'},
me(){return `<div class="card"><b>${esc(S.me.name)}</b><br><span class="note">${esc(S.me.phone)}</span></div><div class="card"><b>تغيير كلمة المرور</b><input id="op" type="password" placeholder="الحالية"><input id="np" type="password" placeholder="الجديدة (8 أحرف على الأقل)"><button class="p w" data-a="pw">حفظ</button></div>`},
fin(){const K={COMMISSION:'عمولة',HANDOVER:'تسوية',FINE:'غرامة مخالفة',FINE_REVERSAL:'إلغاء غرامة'};return `<div class="card">العهدة الحالية<div class="big">${S.me.driver.outstanding} د.ل</div></div>${(S.viol||[]).length?`<div class="card"><b>المخالفات</b>${S.viol.map(v=>`<p>${new Date(v.created*1000).toLocaleDateString('ar-LY')}: ${esc(v.reason)} - غرامة ${v.fine} د.ل${v.order_id?' - طلب #'+v.order_id:''}${v.status==='ACTIVE'?'':' (ملغاة)'}</p>`).join('')}</div>`:''}<div class="card" style="overflow-x:auto"><table><tr><th>التاريخ</th><th>الطلب</th><th>النوع</th><th>المبلغ</th><th>الرصيد</th></tr>${(S.ledger||[]).map(l=>`<tr><td>${new Date(l.at*1000).toLocaleDateString('ar-LY')}</td><td>${l.order_id??'-'}</td><td>${K[l.kind]||l.kind}${l.kind==='COMMISSION'?(l.urgent?' مستعجل':' عادي'):''}</td><td>${l.amount}</td><td>${l.balance_after}</td></tr>`).join('')}</table></div>`}};
const LOC={at:0,err:'',lat:null,lng:null,busy:0};let LT;
async function sendLoc(){if(!S||!S.me.driver.available||LOC.busy)return;LOC.busy=1;try{const p=await TBMap.locate();LOC.lat=p.lat;LOC.lng=p.lng;LOC.err='';await api('POST','/driver/location',{lat:p.lat,lng:p.lng});LOC.at=Date.now()}catch(e){LOC.err=e.message}LOC.busy=0}
function openMap(o){const ov=document.createElement('div'),LK='display:block;text-align:center;padding:12px;border:1px solid var(--g);border-radius:10px;color:var(--g);text-decoration:none;font-weight:600;flex:1',nav=(la,ln)=>`https://www.google.com/maps/dir/?api=1&destination=${la},${ln}`,pts=[];
 ov.style.cssText='position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;gap:8px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))';
 if(o.pickup_lat!=null)pts.push({lat:o.pickup_lat,lng:o.pickup_lng,icon:'📍',label:'الاستلام'});if(o.dropoff_lat!=null)pts.push({lat:o.dropoff_lat,lng:o.dropoff_lng,icon:'🏁',label:'التسليم'});if(LOC.lat!=null)pts.push({lat:LOC.lat,lng:LOC.lng,icon:'🚗',label:'موقعك'});
 ov.innerHTML=`<div id="mv" style="flex:1"></div><div class="row">${o.pickup_lat!=null?`<a href="${nav(o.pickup_lat,o.pickup_lng)}" target="_blank" rel="noopener" style="${LK}">اتجاهات للاستلام</a>`:''}${o.dropoff_lat!=null?`<a href="${nav(o.dropoff_lat,o.dropoff_lng)}" target="_blank" rel="noopener" style="${LK}">اتجاهات للتسليم</a>`:''}</div><button id="mc" class="p w">إغلاق</button>`;
 document.body.appendChild(ov);TBMap.view(ov.querySelector('#mv'),pts);ov.querySelector('#mc').onclick=()=>ov.remove()}
const A={mp:id=>openMap(S.orders.find(o=>o.id==id)),pu:()=>go(async()=>{await enablePush();load()}),pw:()=>go(async()=>{await api('PATCH','/me',{old_password:$('#op').value,new_password:$('#np').value});$('#op').value=$('#np').value='';msg('تم تغيير كلمة المرور')}),av:()=>go(async()=>{await api('POST','/driver/available',{available:!S.me.driver.available});await load();sendLoc()}),
 ho:()=>confirm('إرسال طلب تسوية العهدة للإدارة؟ لن يُصفَّر الرصيد إلا بعد تأكيد الإدارة استلام المبلغ.')&&go(async()=>{await api('POST','/driver/handover-request');await load();msg('تم إرسال الطلب للإدارة')}),
 rj:id=>go(async()=>{await api('POST',`/driver/offers/${id}/reject`);load()}),
 ac:id=>go(async()=>{const p=$('#pr').value;await api('POST',`/driver/offers/${id}/accept`,p===''?{}:{agreed_price:+p});load()}),
 nx:(id,e)=>go(async()=>{await api('POST',`/driver/orders/${id}/status`,{status:e.dataset.s});load()}),
 cn:id=>confirm('إلغاء الطلب؟ سيُعاد توزيعه على سائق آخر.')&&go(async()=>{await api('POST',`/driver/orders/${id}/cancel`);load()})};
$('#app').onclick=e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.id,b)};
tok?start():login();
</script></body></html>
